version: 2

project_name: fargate

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    id: "fargate"
    ldflags:
      - -s -w
      - -X gitlab.com/gitlab-org/ci-cd/custom-executor-drivers/fargate.VERSION={{ .Version }}
      - -X gitlab.com/gitlab-org/ci-cd/custom-executor-drivers/fargate.REVISION={{ .Commit }}
      - -X gitlab.com/gitlab-org/ci-cd/custom-executor-drivers/fargate.BRANCH={{ .Branch }}
      - -X gitlab.com/gitlab-org/ci-cd/custom-executor-drivers/fargate.BUILT={{ .Date }}
    main: ./cmd/fargate
    binary: "{{ .ProjectName }}"

gitlab_urls:
  use_package_registry: true
