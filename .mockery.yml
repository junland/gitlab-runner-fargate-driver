all: true
dir: "{{.InterfaceDir}}"
filename: mock_{{.InterfaceName}}.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 4
generate: true
include-auto-generated: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName | firstUpper}}"
pkgname: "{{.SrcPackageName}}"
recursive: true
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  gitlab.com/gitlab-org/ci-cd/custom-executor-drivers/fargate:
    config:
      all: true
